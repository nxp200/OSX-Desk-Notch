name: OSXDeskNotch
options:
  bundleIdPrefix: com.osxdesknotch
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ANALYZER_NONNULL: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    GCC_NO_COMMON_BLOCKS: YES
    ONLY_ACTIVE_ARCH: NO
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 OSXDeskNotch. All rights reserved."

targets:
  OSXDeskNotch:
    type: application
    platform: macOS
    sources:
      - path: OSXDeskNotch
        excludes:
          - "**/.DS_Store"
    resources:
      - path: OSXDeskNotch/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osxdesknotch.OSXDeskNotch
        INFOPLIST_FILE: OSXDeskNotch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: OSXDeskNotch/Resources/OSXDeskNotch.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: OSXDeskNotch/Resources/OSXDeskNotch-Bridging-Header.h
        OTHER_LDFLAGS:
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "AppKit"
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  OSXDeskNotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OSXDeskNotchTests
    dependencies:
      - target: OSXDeskNotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.osxdesknotch.OSXDeskNotchTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OSXDeskNotch.app/Contents/MacOS/OSXDeskNotch"

schemes:
  OSXDeskNotch:
    build:
      targets:
        OSXDeskNotch: all
        OSXDeskNotchTests: [test]
    test:
      targets:
        - OSXDeskNotchTests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
